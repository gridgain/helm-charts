# Only chart-specific values are set here, everything else falls back to server defaults.
# Keep this file minimal: keys must be valid for every supported GridGain 9 version.
ignite {
    network {
        nodeFinder {
            netClusterNodes=[
                "{{ include "gridgain9.fullname" . }}-headless:{{ .Values.services.headless.ports.cluster }}"
            ]
            type=STATIC
        }
        port={{ .Values.services.headless.ports.cluster }}
    }
    storage {
        profiles=[
            {
                engine=aipersist
                name=default
                sizeBytes={{ mul (div (include "gridgain9.memoryToBytes" .Values.resources.limits.memory) 100) .Values.storage.profile.memoryPercentage }}
            }
        ]
    }
}
